:#00ff88}.bd{background:rgba(255,64,96,.15);border:1px solid rgba(255,64,96,.3);color:#ff4060;border-radius:8px;padding:8px 20px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:15px;transition:.2s}.bd:hover{background:rgba(255,64,96,.25)}.bg{padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}.bg-g{background:rgba(0,255,136,.12);color:#00ff88}.bg-y{background:rgba(255,190,11,.12);color:#ffbe0b}.bg-r{background:rgba(255,64,96,.12);color:#ff4060}.bg-b{background:rgba(0,212,255,.12);color:#00d4ff}table{width:100%;border-collapse:separate;border-spacing:0}thead th{background:#0a1225;color:#7a8da6;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;border-bottom:1px solid #152040;position:sticky;top:0;z-index:1}tbody td{padding:10px 12px;border-bottom:1px solid #0e1830;font-size:14px}tbody tr:hover{background:rgba(0,255,136,.04)}.tst{animation:si .3s ease}@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes pg{0%,100%{box-shadow:0 0 5px rgba(0,255,136,.2)}50%{box-shadow:0 0 20px rgba(0,255,136,.4)}}.pb{animation:pg 2s infinite}.lg{filter:drop-shadow(0 0 8px rgba(0,255,136,.5))}.lg:hover{filter:drop-shadow(0 0 16px rgba(0,255,136,.7))}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes sl{0%{top:-100%}100%{top:200%}}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.il{background:rgba(10,18,37,.8);border:1px solid #152040;border-radius:10px;padding:12px 16px 12px 44px;color:#e0e7f1;font-family:'Rajdhani',sans-serif;font-size:16px;width:100%;transition:.3s}.il:focus{outline:none;border-color:#00ff88;box-shadow:0 0 0 3px rgba(0,255,136,.15)}.il::placeholder{color:#3e506b}@media print{.np{display:none!important}}
/* === RESPONSIVE === */
#sb-overlay{display:none}
@media(max-width:1023px){
  /* Sidebar becomes drawer on tablet/mobile */
  #S_APP aside{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .25s ease;z-index:150;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #S_APP aside.open{transform:translateX(0)}
  #sb-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:140;backdrop-filter:blur(2px)}
  #sb-overlay.hide{display:none}
  #sb-burger{display:inline-flex!important}
  body{overflow:hidden}
}
@media(min-width:1024px){
  #sb-burger{display:none!important}
  #sb-overlay{display:none!important}
}
@media(max-width:640px){
  /* Compact padding on small phones */
  #ctn{padding:14px!important}
  #sb-app-header{padding-left:14px!important;padding-right:14px!important}
  #hd-t{font-size:13px}
  #hd-d{font-size:11px}
  /* Modal takes most of the viewport */
  #mdl-ct{max-width:100%!important;border-radius:14px}
  /* Modal inner padding compact */
  .mdl-pad{padding:18px!important}
  /* Tables - smaller font on mobile */
  thead th{padding:8px 8px;font-size:10px}
  tbody td{padding:7px 8px;font-size:12px}
  /* Stat cards on dashboard - smaller text */
  .stat-card{padding:14px!important}
  /* Buttons - touch-friendly minimum */
  .bp,.bs,.bd{padding:9px 16px;font-size:14px;min-height:38px}
  .inp{padding:9px 12px;font-size:14px;min-height:38px}
  /* Toast full width */
  #tst-c{left:8px!important;right:8px!important;top:8px!important}
  #tst-c>div{width:100%!important}
  /* Login card compact */
  .login-card{padding:22px 18px!important}
}

function oPr(id){edId=id;var p=id?D.pres.find(function(x){return x.id===id}):null;tmpIt=p?JSON.parse(JSON.stringify(p.items)):[];mdl('<div class="p-6 mdl-pad"><div class="flex items-center justify-between mb-6"><h3 class="fd text-lg font-bold text-at-accent">'+(p?'EDITAR':'NUEVO')+' PRESUPUESTO</h3><button onclick="cmdl()" class="text-at-mut hover:text-white"><i class="fas fa-times text-lg"></i></button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5"><div><label class="text-xs text-at-mut font-semibold mb-1 block">Fecha</label><input id="pp-fe" type="date" class="inp" value="'+(p?p.fecha:tdy())+'"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Validez (dias)</label><input id="pp-va" type="number" class="inp" value="'+(p?p.val:15)+'" min="1"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Cliente</label><input id="pp-cl" class="inp" value="'+(p?p.cln:'')+'" placeholder="Nombre"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">RUC/CI</label><input id="pp-cr" class="inp" value="'+(p?p.clr:'')+'" placeholder="RUC"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Telefono</label><input id="pp-ct" class="inp" value="'+(p?p.clt||'':'')+'" placeholder="Tel"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Direccion</label><input id="pp-cd" class="inp" value="'+(p?p.cld||'':'')+'" placeholder="Dir"></div></div>'+(p?'<div class="mb-4"><label class="text-xs text-at-mut font-semibold mb-1 block">Estado</label><select id="pp-es" class="inp w-auto"><option'+(p.estado==='Pendiente'?' selected':'')+'>Pendiente</option><option'+(p.estado==='Aprobado'?' selected':'')+'>Aprobado</option><option'+(p.estado==='Rechazado'?' selected':'')+'>Rechazado</option></select></div>':'')+'<div class="mb-4"><div class="flex items-center justify-between mb-2"><h4 class="fd text-sm font-bold text-at-cyan">ITEMS</h4><button class="bs text-xs py-1 px-3" onclick="aPI()"><i class     // --- Datos del cliente ---

    if(pr.clt){doc.setTextColor(0,100,50);doc.setFont('helvetica','bold');doc.text('Tel:',20,y+14);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text(pr.clt,32,y+14)}

    // --- Tabla de items ---
    y=76;
    doc.autoTable({
        startY:y,
        head:[['Cant.','Descripcion','P. Unitario','Subtotal']],
        body:pr.items.map(function(it){return[it.cant,it.desc,fgsPdf(it.pu),fgsPdf(it.cant*it.pu)]}),

    });

    doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.text('Subtotal:',145,y);doc.text(fgsPdf(pr.sub),190,y,{align:'right'});

function svClient(id){var g=function(i){return(document.getElementById(i)||{}).value||''},name=g('cl-n').trim();if(!name){toast('Ingrese el nombre del cliente','error');return}var d={id:id||gid(),name:name,ruc:g('cl-r').trim(),tel:g('cl-t').trim(),email:g('cl-e').trim(),city:g('cl-ci').trim(),dir:g('cl-d').trim(),obs:g('cl-o').trim()};if(id){var i=D.clients.findIndex(function(x){return x.id===id});if(i>=0)D.clients[i]=d}else D.clients.push(d);saveD();cmdl();rClients();toast(id?'Cliente actualizado':'Cliente agregado')}

function oPurchase(){tmpIt=[];var opts=D.suppliers.map(function(x){return'<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('');mdl('<div class="p-6 mdl-pad"><div class="flex items-center justify-between mb-5"><h3 class="fd text-lg font-bold text-at-accent">NUEVA COMPRA</h3><button onclick="cmdl()" class="text-at-mut"><i class="fas fa-times"></i></button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="text-xs text-at-mut font-semibold mb-1 block">Proveedor</label><select id="cp-sp" class="inp"><option value="">-- Seleccionar --</option>'+opts+'</select></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Fecha</label><input id="cp-fe" type="date" class="inp" value="'+tdy()+'"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Condicion</label><select id="cp-co" class="inp"><option>Contado</option><option>Credito</option></select></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Comprobante</label><input id="cp-cm" class="inp" placeholder="Factura del proveedor"></div></div><div class="flex justify-between mb-2"><h4 class="fd text-sm text-at-cyan">PRODUCTOS</h4><button class="bs text-xs" onclick="aPurchaseItem()"><i class="fas fa-plus mr-1"></i>Agregar</button></div><div class="overflow-x-auto"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Costo unit.</th><th>Subtotal</th><th></th></tr></thead><tbody id="cp-tb"></tbody></table></div><div class="bg-at-bg rounded-lg p-4 mt-4 text-right"><span class="text-at-mut mr-3">TOTAL</span><strong id="cp-total" class="text-xl text-at-accent">Gs. 0</strong></div><div class="flex justify-end gap-3 mt-5"><button class="bs" onclick="cmdl()">Cancelar</button><button class="bp" onclick="svPurchase()">Registrar compra</button></div></div>');aPurchaseItem()}

function svPurchase(){var sid=parseInt((document.getElementById('cp-sp')||{}).value)||0,s=D.suppliers.find(function(x){return x.id===sid});if(!s){toast('Seleccione un proveedor','error');return}var items=tmpIt.filter(function(x){return x.pid>0&&x.cant>0&&x.pu>=0});if(!items.length){toast('Agregue productos','error');return}var total=items.reduce(function(a,x){return a+x.cant*x.pu},0);var d={id:gid(),num:D.ncomp++,fecha:document.getElementById('cp-fe').value,supplierId:s.id,supplierName:s.name,cond:document.getElementById('cp-co').value,comprobante:document.getElementById('cp-cm').value.trim(),items:JSON.parse(JSON.stringify(items)),total:total};D.purchases.push(d);items.forEach(function(it){var p=D.products.find(function(x){return x.id===it.pid});if(p)p.st+=it.cant});if(d.cond==='Contado')D.cash.push({id:gid(),fecha:d.fecha,tipo:'egreso',concepto:'Compra COMP-'+String(d.num).padStart(3,'0')+' - '+s.name,monto:total,ref:d.id});saveD();cmdl();rPurchases();toast('Compra registrada y stock actualizado')}
