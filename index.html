function saveCpw(){var n1=document.getElementById('cp-n1').value;var n2=document.getElementById('cp-n2').value;var er=document.getElementById('cp-err');if(n1.length<4){er.textContent='Minimo 4 caracteres';er.style.display='block';return}if(n1!==n2){er.textContent='No coinciden';er.style.display='block';return}var users=getUsers()||[];var idx=-1;for(var i=0;i<users.length;i++){if(users[i].id===CU.id){idx=i;break}}if(idx>=0){users[idx].pw=encPw(n1);users[idx].mustChange=false;saveUsers(users);CU=users[idx]}er.style.display='none';toast('Contrasena cambiada');enterApp()}

function checkSession(){try{var s=JSON.parse(lg('at6_session'));if(s&&Date.now()-s.t<86400000){var users=ensureAdmin();var user=null;for(var i=0;i<users.length;i++){if(users[i].id===s.uid&&users[i].active){user=users[i];break}}if(user){CU=user;if(user.mustChange){showScr('S_CPW')}else{enterApp()}return}}}catch(e){}ensureAdmin();showScr('S_LOGIN')}

// ---- FORMATO DE NUMEROS ----
function fgs(n){return'Gs. '+fmtNum(n)}
function fmtNum(n){var s=Math.round(Number(n)).toString();var r='';var c=0;for(var i=s.length-1;i>=0;i--){r=s[i]+r;c++;if(c%3===0&&i>0)r='.'+r}return r}
// Formato especial para PDF (sin simbolos unicode)
function fgsPdf(n){return'Gs. '+fmtNum(n)}

function gid(){return Date.now()+Math.floor(Math.random()*1000)}
function fdt(d){return new Date(d).toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit',year:'numeric'})}
function tdy(){return new Date().toISOString().split('T')[0]}
function toast(m,t){t=t||'success';var c=document.getElementById('tst-c');var cl={success:'border-at-accent bg-at-accent/10 text-at-accent',error:'border-at-err bg-at-err/10 text-at-err',warning:'border-at-wrn bg-at-wrn/10 text-at-wrn',info:'border-at-cyan bg-at-cyan/10 text-at-cyan'};var ic={success:'fa-check-circle',error:'fa-times-circle',warning:'fa-exclamation-triangle',info:'fa-info-circle'};var el=document.createElement('div');el.className='tst border-l-4 '+(cl[t]||cl.info)+' px-4 py-3 rounded-lg flex items-center gap-3 min-w-[280px] mb-2';el.innerHTML='<i class="fas '+(ic[t]||ic.info)+'"></i><span class="font-semibold text-sm">'+m+'</span>';c.appendChild(el);setTimeout(function(){el.remove()},3000)}
function nav(s){if(s==='users'&&CU&&CU.role!=='admin'){toast('Acceso denegado','error');return}curSec=s;var btns=document.querySelectorAll('.ni');for(var i=0;i<btns.length;i++){btns[i].classList.toggle('on',btns[i].getAttribute('data-s')===s)}var secs=['dash','stock','pres','fac','users'];for(var i=0;i<secs.length;i++){var el=document.getElementById('R-'+secs[i]);if(el)el.style.display=secs[i]===s?'block':'none'}var tl={dash:'DASHBOARD',stock:'CONTROL DE STOCK',pres:'PRESUPUESTOS',fac:'FACTURACION',users:'USUARIOS'};document.getElementById('hd-t').textContent=tl[s]||s;render(s);toggleSidebar(false)}

// ==================== PDF PRESUPUESTO (CORREGIDO) ====================
function pdfPr(id){
    var pr=D.pres.find(function(p){return p.id===id});if(!pr)return;
    var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();
    var BIZ=getBiz();

    // --- Membrete claro y profesional ---
    // Linea verde superior
    doc.setFillColor(0,153,76);doc.rect(0,0,210,4,'F');
    // Fondo blanco del membrete
    doc.setFillColor(255,255,255);doc.rect(0,4,210,36,'F');
    // Linea inferior del membrete
    doc.setDrawColor(0,153,76);doc.setLineWidth(0.5);doc.line(15,40,195,40);

    // Logo (si existe)
    if(BIZ.logo){try{doc.addImage(BIZ.logo,'JPEG',15,8,12,12)}catch(e){}}

    // Nombre empresa
    doc.setTextColor(0,100,50);doc.setFontSize(20);doc.setFont('helvetica','bold');
    doc.text(BIZ.name||'EMPRESA',15,18);
    // Datos empresa
    doc.setTextColor(80,80,80);doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text('RUC: '+(BIZ.ruc||'-'),15,25);
    doc.text('Tel: '+(BIZ.tel||'-'),15,30);
    doc.text(BIZ.dir||'',15,35);

    // Titulo documento
    doc.setTextColor(0,100,50);doc.setFontSize(16);doc.setFont('helvetica','bold');
    doc.text('PRESUPUESTO',195,18,{align:'right'});
    // Numero y fecha
    doc.setTextColor(80,80,80);doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.text('Nro: PRES-'+String(pr.num).padStart(3,'0'),195,26,{align:'right'});
    doc.text('Fecha: '+fdt(pr.fecha),195,32,{align:'right'});
    doc.text('Validez: '+pr.val+' dias',195,37,{align:'right'});

    // --- Datos del cliente ---
    var y=48;
    doc.setFillColor(245,248,245);doc.roundedRect(15,y,180,22,2,2,'F');
    doc.setTextColor(0,100,50);doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('CLIENTE:',20,y+7);
    doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');
    doc.text(pr.cln,42,y+7);
    if(pr.clr){doc.setTextColor(0,100,50);doc.setFont('helvetica','bold');doc.text('RUC/CI:',105,y+7);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text(pr.clr,125,y+7)}
    if(pr.clt){doc.setTextColor(0,100,50);doc.setFont('helvetica','bold');doc.text('Tel:',20,y+14);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text(pr.clt,32,y+14)}
    if(pr.cld){doc.setTextColor(0,100,50);doc.setFont('helvetica','bold');doc.text('Dir:',105,y+14);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text(pr.cld,117,y+14)}

    // --- Tabla de items ---
    y=76;
    doc.autoTable({
        startY:y,
        head:[['Cant.','Descripcion','P. Unitario','Subtotal']],
        body:pr.items.map(function(it){return[it.cant,it.desc,fgsPdf(it.pu),fgsPdf(it.cant*it.pu)]}),
        theme:'grid',
        headStyles:{fillColor:[0,100,50],textColor:[255,255,255],fontStyle:'bold',fontSize:9},
        bodyStyles:{textColor:[40,40,40],fontSize:9},
        columnStyles:{0:{halign:'center',cellWidth:18},2:{halign:'right',cellWidth:38},3:{halign:'right',cellWidth:38}},
        margin:{left:15,right:15}
    });

    // --- Totales ---
    y=doc.lastAutoTable.finalY+8;
    doc.setTextColor(40,40,40);
    doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.text('Subtotal:',145,y);doc.text(fgsPdf(pr.sub),190,y,{align:'right'});
    doc.text('IVA 10%:',145,y+7);doc.text(fgsPdf(pr.iva),190,y+7,{align:'right'});
    // Linea sobre total
    doc.setDrawColor(0,100,50);doc.setLineWidth(0.5);doc.line(145,y+10,190,y+10);
    doc.setFont('helvetica','bold');doc.setFontSize(12);
    doc.setTextColor(0,100,50);
    doc.text('TOTAL:',145,y+17);doc.text(fgsPdf(pr.total),190,y+17,{align:'right'});

    // Notas
    if(pr.notas){doc.setTextColor(80,80,80);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('Notas:',15,y+30);doc.setFont('helvetica','normal');doc.text(pr.notas,15,y+36)}

    // Pie de pagina
    doc.setDrawColor(0,153,76);doc.setLineWidth(0.3);doc.line(15,275,195,275);
    doc.setTextColor(120,120,120);doc.setFontSize(8);doc.setFont('helvetica','normal');
    doc.text('Validez: '+pr.val+' dias desde la fecha de emision.',105,280,{align:'center'});
    doc.text((BIZ.name||'EMPRESA')+' - RUC: '+(BIZ.ruc||'-')+' - Tel: '+(BIZ.tel||'-'),105,285,{align:'center'});

    doc.save('PRES_'+String(pr.num).padStart(3,'0')+'.pdf');toast('PDF generado');
}

text-at-cyan mt-0.5"></i><p class="text-xs text-at-mut">Estos datos se usan en el membrete de presupuestos PDF, facturas impresas, barra lateral y pagina de login.</p></div>';h+='<div class="flex justify-end gap-3 pt-3 border-t border-at-bdr"><button class="bs" onclick="cmdl()">Cancelar</button><button class="bp" onclick="svBiz()"><i class="fas fa-save mr-2"></i>Guardar Cambios</button></div></div>';mdl(h)}
function svBiz(){var g=function(id){var el=document.getElementById(id);return el?el.value:''};var b={name:g('bz-name'),short:g('bz-short'),sub:g('bz-sub'),ruc:g('bz-ruc'),tel:g('bz-tel'),dir:g('bz-dir'),logo:g('bz-logo')};if(!b.name){toast('Ingrese el nombre de fantasia','error');return}if(!b.short)b.short=b.name.split(' ')[0]||'EMP';if(!b.sub)b.sub='';saveBiz(b);aplyBiz();cmdl();toast('Configuracion guardada')}
function toggleSidebar(forceState){var aside=document.getElementById('sb-aside');var overlay=document.getElementById('sb-overlay');if(!aside)return;var isOpen=aside.classList.contains('open');var willOpen=(forceState===true)||(forceState===undefined&&!isOpen);if(willOpen){aside.classList.add('open');if(overlay){overlay.classList.remove('hide')}}else{aside.classList.remove('open');if(overlay){overlay.classList.add('hide')}}}
function mdl(h){document.getElementById('mdl-ct').innerHTML=h;var bg=document.getElementById('mdl-bg');bg.style.display='flex';bg.style.alignItems='center';bg.style.justifyContent='center'}
function cmdl(){document.getElementById('mdl-bg').style.display='none';tmpIt=[];edId=null}
function cfm(msg,cb){mdl('<div class="p-6 text-center" style="max-width:400px;margin:0 auto"><div class="w-16 h-16 rounded-full bg-at-err/10 flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-at-err text-2xl"></i></div><p class="text-lg font-semibold mb-6">'+msg+'</p><div class="flex justify-center gap-3"><button class="bs" onclick="cmdl()">Cancelar</button><button class="bd" id="cfm-b">Confirmar</button></div></div>');document.getElementById('cfm-b').onclick=function(){cmdl();cb()}}
document.getElementById('mdl-bg').addEventListener('click',function(e){if(e.target===this)cmdl()});
