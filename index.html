:#00ff88}.bd{background:rgba(255,64,96,.15);border:1px solid rgba(255,64,96,.3);color:#ff4060;border-radius:8px;padding:8px 20px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:15px;transition:.2s}.bd:hover{background:rgba(255,64,96,.25)}.bg{padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}.bg-g{background:rgba(0,255,136,.12);color:#00ff88}.bg-y{background:rgba(255,190,11,.12);color:#ffbe0b}.bg-r{background:rgba(255,64,96,.12);color:#ff4060}.bg-b{background:rgba(0,212,255,.12);color:#00d4ff}table{width:100%;border-collapse:separate;border-spacing:0}thead th{background:#0a1225;color:#7a8da6;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;border-bottom:1px solid #152040;position:sticky;top:0;z-index:1}tbody td{padding:10px 12px;border-bottom:1px solid #0e1830;font-size:14px}tbody tr:hover{background:rgba(0,255,136,.04)}.tst{animation:si .3s ease}@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes pg{0%,100%{box-shadow:0 0 5px rgba(0,255,136,.2)}50%{box-shadow:0 0 20px rgba(0,255,136,.4)}}.pb{animation:pg 2s infinite}.lg{filter:drop-shadow(0 0 8px rgba(0,255,136,.5))}.lg:hover{filter:drop-shadow(0 0 16px rgba(0,255,136,.7))}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes sl{0%{top:-100%}100%{top:200%}}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.il{background:rgba(10,18,37,.8);border:1px solid #152040;border-radius:10px;padding:12px 16px 12px 44px;color:#e0e7f1;font-family:'Rajdhani',sans-serif;font-size:16px;width:100%;transition:.3s}.il:focus{outline:none;border-color:#00ff88;box-shadow:0 0 0 3px rgba(0,255,136,.15)}.il::placeholder{color:#3e506b}@media print{.np{display:none!important}}
/* === RESPONSIVE === */
#sb-overlay{display:none}
@media(max-width:1023px){
  /* Sidebar becomes drawer on tablet/mobile */
  #S_APP aside{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .25s ease;z-index:150;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #S_APP aside.open{transform:translateX(0)}
  #sb-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:140;backdrop-filter:blur(2px)}
  #sb-overlay.hide{display:none}
  #sb-burger{display:inline-flex!important}
  body{overflow:hidden}
}
@media(min-width:1024px){
  #sb-burger{display:none!important}
  #sb-overlay{display:none!important}
}
@media(max-width:640px){
  /* Compact padding on small phones */
  #ctn{padding:14px!important}
  #sb-app-header{padding-left:14px!important;padding-right:14px!important}
  #hd-t{font-size:13px}
  #hd-d{font-size:11px}
  /* Modal takes most of the viewport */
  #mdl-ct{max-width:100%!important;border-radius:14px}
  /* Modal inner padding compact */
  .mdl-pad{padding:18px!important}
  /* Tables - smaller font on mobile */
  thead th{padding:8px 8px;font-size:10px}
  tbody td{padding:7px 8px;font-size:12px}
  /* Stat cards on dashboard - smaller text */
  .stat-card{padding:14px!important}
  /* Buttons - touch-friendly minimum */
  .bp,.bs,.bd{padding:9px 16px;font-size:14px;min-height:38px}
  .inp{padding:9px 12px;font-size:14px;min-height:38px}
  /* Toast full width */
  #tst-c{left:8px!important;right:8px!important;top:8px!important}
  #tst-c>div{width:100%!important}
  /* Login card compact */
  .login-card{padding:22px 18px!important}
}

/* === MARGENES ADAPTATIVOS PC / ANDROID === */
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100%;height:100dvh}
#S_APP{height:100dvh!important}
#S_APP main{min-width:0}
#ctn{padding:24px}

@media(min-width:1024px){
  #ctn{padding:24px 28px 32px}

}

@media(max-width:1023px){
  #ctn{padding:18px}
  #sb-app-header{padding-left:18px!important;padding-right:18px!important}
}

@media(max-width:640px){
  #ctn{padding:10px!important}
  #sb-app-header{padding-left:10px!important;padding-right:10px!important}
  #tst-c{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));left:max(8px,env(safe-area-inset-left))}

}

@media(max-width:380px){
  #ctn{padding:8px!important}

}

function normalizeD(d){
  d=d||{};
  var arrs=['products','pres','facs','clients','suppliers','purchases','cash','services','remisiones','ots','rentals','audit'];
  var aliases={compras:'purchases',movimientosCaja:'cash',caja:'cash',servicios:'services',ordenesTrabajo:'ots',ordenes:'ots'};
  Object.keys(aliases).forEach(function(k){if((!d[aliases[k]]||!Array.isArray(d[aliases[k]]))&&Array.isArray(d[k]))d[aliases[k]]=d[k]});
  arrs.forEach(function(k){if(!Array.isArray(d[k]))d[k]=[]});
  if(!Number.isFinite(Number(d.np))||Number(d.np)<1)d.np=1;
  if(!Number.isFinite(Number(d.nf))||Number(d.nf)<1)d.nf=1;
  if(!Number.isFinite(Number(d.ncomp))||Number(d.ncomp)<1)d.ncomp=1;
  if(!Number.isFinite(Number(d.nsvc))||Number(d.nsvc)<1)d.nsvc=1;
  if(!Number.isFinite(Number(d.nrem))||Number(d.nrem)<1)d.nrem=1;
  if(!Number.isFinite(Number(d.nrent))||Number(d.nrent)<1)d.nrent=1;
  if(!Number.isFinite(Number(d.not))||Number(d.not)<1)d.not=1;
  d.products.forEach(function(x){x.id=x.id||gid();x.st=Number(x.st)||0;x.sm=Number(x.sm)||0;x.pc=Number(x.pc)||0;x.pv=Number(x.pv)||0;x.barcode=x.barcode||x.cod||''});
  d.purchases.forEach(function(x){x.id=x.id||gid();x.items=Array.isArray(x.items)?x.items:[];x.total=Number(x.total)||0;x.num=Number(x.num)||0});
  d.cash.forEach(function(x){x.id=x.id||gid();x.monto=Number(x.monto)||0;x.tipo=x.tipo==='egreso'?'egreso':'ingreso';x.concepto=x.concepto||''});
  d.services.forEach(function(x){x.id=x.id||gid();x.num=Number(x.num)||0;x.amount=Number(x.amount)||0;x.estado=x.estado||'Recibido'});
  d.ots.forEach(function(x){x.id=x.id||gid();x.num=Number(x.num)||0;x.monto=Number(x.monto)||0;x.estado=x.estado||'Recibido'});
  d.facs.forEach(function(x){x.id=x.id||gid();x.num=Number(x.num)||0;x.total=Number(x.total)||0;x.pagos=Array.isArray(x.pagos)?x.pagos:[];x.cargos=x.cargos||{};});
  d.rentals.forEach(function(x){x.id=x.id||gid();x.num=Number(x.num)||0;x.abono=Number(x.abono)||0;x.precioEx=Number(x.precioEx)||0;x.pagos=Array.isArray(x.pagos)?x.pagos:[];x.cargos=x.cargos||{};});
  return d;
}

ap-2"><input id="fp-bc" class="inp" value="'+(p?(p.barcode||p.cod||''):'')+'" placeholder="Se genera desde el codigo si queda vacio"><button type="button" class="bs" onclick="useProductCodeAsBarcode()" title="Usar codigo del producto"><i class="fas fa-wand-magic-sparkles"></i></button></div><p class="text-[10px] text-at-mut mt-1">Formato: Code 128. Si no escribis uno, se usa automaticamente el codigo del producto.</p></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Stock</label><input id="fp-st" type="number" class="inp" value="'+(p?p.st:0)+'" placeholder="0"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Stock Min</label><input id="fp-sm" type="number" class="inp" value="'+(p?p.sm:1)+'" placeholder="1"></div></div><div class="flex justify-end gap-3 mt-6"><button class="bs" onclick="cmdl()">Cancelar</button><button class="bp" onclick="svProd()"><i class="fas fa-save mr-2"></i>Guardar</button></div></div>');if(!p){autoProdCode('');var nmEl=document.getElementById('fp-nm');if(nmEl)nmEl.addEventListener('input',function(){autoProdCode(this.value)})}}

function normalizedBarcodeValue(p){
  if(!p)return '';
  var v=String(p.barcode||p.cod||'').trim();
  if(!v){v='PRO-'+String(p.id||gid());p.barcode=v;}
  return v;
}
function useProductCodeAsBarcode(){
  var code=(document.getElementById('fp-cd')||{}).value||'';
  var el=document.getElementById('fp-bc');
  if(el)el.value=code.trim();
}
function buildBarcodeSvg(value){
  if(typeof JsBarcode!=='function'){
    toast('No se pudo cargar el generador de barras. Revisá la conexion a Internet.','error');
    return '';
  }
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  try{
    JsBarcode(svg,String(value),{format:'CODE128',displayValue:true,font:'Arial',fontSize:14,textMargin:2,height:52,width:2,margin:4,background:'#ffffff',lineColor:'#000000'});
    return svg.outerHTML;
  }catch(e){
    toast('El valor del codigo de barras no es valido','error');
    return '';
  }
}

  var p=D.products.find(function(x){return x.id===id});

function cNorm(v){return String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim()}
function cMatches(term){var q=cNorm(term);if(!q)return[];return D.clients.filter(function(c){var n=cNorm(c.name),r=cNorm(c.ruc),t=cNorm(c.tel),e=cNorm(c.email);return n.indexOf(q)>=0||r.indexOf(q)>=0||t.indexOf(q)>=0||e.indexOf(q)>=0}).sort(function(a,b){var an=cNorm(a.name),ar=cNorm(a.ruc),bn=cNorm(b.name),br=cNorm(b.ruc);var as=(an===q||ar===q)?0:an.indexOf(q)===0||ar.indexOf(q)===0?1:2;var bs=(bn===q||br===q)?0:bn.indexOf(q)===0||br.indexOf(q)===0?1:2;return as-bs||an.localeCompare(bn)})}
function clientFields(pref){var m={pp:['pp-cl','pp-cr','pp-ct','pp-cd'],ff:['ff-cl','ff-cr','ff-ct','ff-cd'],sv:['sv-c','sv-r','sv-t','sv-d'],rm:['rm-c','rm-r','rm-t','rm-d'],ot:['ot-c','ot-r','ot-t','ot-d'],al:['al-c','al-r','al-t','al-d']};return m[pref]||[]}
function clientPicker(pref,name,ruc,id){
  var q=(name||ruc||'');
  return `<div class="md:col-span-2 relative"><label class="text-xs text-at-mut font-semibold mb-1 block"><i class="fas fa-user-check mr-1 text-at-accent"></i>Buscar cliente por nombre o RUC</label><div class="flex gap-2"><input id="${pref}-find" class="inp" value="${esc(q)}" placeholder="Escriba nombre o RUC..." autocomplete="off" oninput="clientLookup('${pref}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();clientEnter('${pref}',this.value)}"><button type="button" class="bs whitespace-nowrap" onclick="clientLookup('${pref}',document.getElementById('${pref}-find').value)"><i class="fas fa-search mr-1"></i>Buscar</button><button type="button" id="${pref}-web" class="bs whitespace-nowrap" title="Buscar en RUC SUNCOM" onclick="consultWebFor('${pref}')"><i class="fas fa-globe"></i> WEB</button></div><input type="hidden" id="${pref}-clid" value="${id||0}"><div id="${pref}-matches" class="absolute left-0 right-0 top-[72px] z-40 bg-at-card border border-at-bdr rounded-xl shadow-2xl overflow-hidden" style="display:none"></div><p class="text-[11px] text-at-mut mt-1">Puede buscar entre tus clientes o consultar RUC SUNCOM por nombre o RUC. Fuente independiente basada en datos públicos de DNIT.</p></div>`;
}function clientLookup(pref,term){var box=document.getElementById(pref+'-matches');if(!box)return;var q=String(term||'').trim();if(q.length<1){box.style.display='none';return}var a=cMatches(q).slice(0,8);if(!a.length){box.innerHTML='<div class="px-4 py-3 text-xs text-at-mut">No se encontró coincidencia. Puede completar los datos manualmente.</div>';box.style.display='block';return}box.innerHTML=a.map(function(c){return'<button type="button" class="w-full text-left px-4 py-3 hover:bg-at-bg border-b border-at-bdr/50 last:border-b-0" onclick="selectClientFor(\\''+pref+'\\','+c.id+')"><div class="font-semibold text-sm">'+esc(c.name||'')+'</div><div class="text-xs text-at-mut mt-0.5">RUC/CI: '+esc(c.ruc||'-')+(c.tel?' · Tel: '+esc(c.tel):'')+'</div></button>'}).join('');box.style.display='block'}
function clientEnter(pref,term){var a=cMatches(term),q=cNorm(term),r=a.filter(function(c){return cNorm(c.ruc)===q&&q}),n=a.filter(function(c){return cNorm(c.name)===q&&q});if(r.length===1){selectClientFor(pref,r[0].id);return}if(n.length===1){selectClientFor(pref,n[0].id);return}if(a.length===1){selectClientFor(pref,a[0].id);return}clientLookup(pref,term)}
function selectClientFor(pref,id){var c=D.clients.find(function(x){return x.id===parseInt(id)});if(!c)return;var f=clientFields(pref);var vals=[c.name||'',c.ruc||'',c.tel||'',c.dir||''];for(var i=0;i<f.length;i++){var e=document.getElementById(f[i]);if(e)e.value=vals[i]||''}var hid=document.getElementById(pref+'-clid');if(hid)hid.value=c.id;var find=document.getElementById(pref+'-find');if(find)find.value=(c.name||'')+(c.ruc?' · '+c.ruc:'');var box=document.getElementById(pref+'-matches');if(box)box.style.display='none';toast('Cliente seleccionado: '+(c.name||''),'success')}
function clientAutoFromFields(pref){var f=clientFields(pref),a=document.getElementById(f[0]),r=document.getElementById(f[1]);var name=a?String(a.value||'').trim():'',ruc=r?String(r.value||'').trim():'';var q=cNorm(name||ruc);if(!q)return;var byR=ruc?D.clients.filter(function(c){return cNorm(c.ruc)===cNorm(ruc)&&cNorm(ruc)}):[],byN=name?D.clients.filter(function(c){return cNorm(c.name)===cNorm(name)&&cNorm(name)}):[];var exact=byR.length===1?byR[0]:(byN.length===1?byN[0]:null);if(exact)selectClientFor(pref,exact.id)}
function resolveClientId(pref){var hid=document.getElementById(pref+'-clid'),id=parseInt(hid&&hid.value)||0;if(id&&D.clients.some(function(c){return c.id===id}))return id;var f=clientFields(pref),a=document.getElementById(f[0]),r=document.getElementById(f[1]);var name=cNorm(a&&a.value),ruc=cNorm(r&&r.value),byR=ruc?D.clients.filter(function(c){return cNorm(c.ruc)===ruc&&ruc}):[],byN=name?D.clients.filter(function(c){return cNorm(c.name)===name&&name}):[];var exact=byR.length===1?byR[0]:(byN.length===1?byN[0]:null);if(hid)hid.value=exact?exact.id:0;return exact?exact.id:0}

function webClientName(c){return String((c&&c.name)||'').trim()}
function webClientRuc(c){return String((c&&c.fullRuc)||(c&&c.ruc?((c.ruc&&c.dv)?c.ruc+'-'+c.dv:c.ruc):'')).trim()}
function applyWebClientFor(pref,idx){var a=(window.__webClients&&window.__webClients[pref])||[],c=a[parseInt(idx)];if(!c)return;var f=clientFields(pref),ne=document.getElementById(f[0]),re=document.getElementById(f[1]),te=document.getElementById(f[2]),de=document.getElementById(f[3]),nm=webClientName(c),rr=webClientRuc(c);if(ne&&nm)ne.value=nm;if(re&&rr)re.value=rr;if(te&&c.tel)te.value=c.tel;if(de&&c.dir)de.value=c.dir;var find=document.getElementById(pref+'-find');if(find)find.value=(nm?nm+' · ':'')+rr;var hid=document.getElementById(pref+'-clid');if(hid)hid.value=0;var box=document.getElementById(pref+'-matches');if(box)box.style.display='none';toast('WEB: '+(nm||'Contribuyente')+(rr?' · RUC '+rr:''),'success')}
function renderWebMatchesFor(pref,a){window.__webClients=window.__webClients||{};window.__webClients[pref]=a||[];var box=document.getElementById(pref+'-matches');if(!box)return;box.innerHTML=(a||[]).slice(0,8).map(function(c,i){var nm=webClientName(c),rr=webClientRuc(c),st=c.state||'';return `<button type="button" class="w-full text-left px-4 py-3 hover:bg-at-bg border-b border-at-bdr/50 last:border-b-0" onclick="applyWebClientFor('${pref}',${i})"><div class="font-semibold text-sm">${esc(nm||'Sin nombre')}</div><div class="text-xs text-at-mut mt-0.5">RUC: ${esc(rr||'-')}${st?' · Estado: '+esc(st):''} · Fuente: RUC SUNCOM</div></button>`}).join('');box.style.display='block'}
async function consultWebFor(pref){var fs=clientFields(pref),q=((document.getElementById(pref+'-find')||{}).value||'').trim(),r=((document.getElementById(fs[1])||{}).value||'').trim(),raw=(q||r);if(raw.indexOf('·')>=0)raw=raw.split('·')[0].trim();if(!raw){toast('Ingrese un nombre o RUC para buscar en la web.','error');return}var btn=document.getElementById(pref+'-web');if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>'}try{var res=await fetch(SUPABASE_URL+'/functions/v1/dnit-ruc-lookup',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({q:raw})});var out=await res.json();if(!res.ok||!out||!out.ok){toast((out&&out.error)||'No se pudo consultar la fuente web.','error');return}var arr=Array.isArray(out.results)?out.results:[];if(!arr.length){toast('No se encontró coincidencia en RUC SUNCOM.','error');return}window.__webClients=window.__webClients||{};window.__webClients[pref]=arr;if(arr.length===1){applyWebClientFor(pref,0);return}renderWebMatchesFor(pref,arr);toast('Se encontraron '+arr.length+' coincidencias. Seleccione la correcta.','success')}catch(e){console.error(e);toast('No se pudo conectar con la consulta web.','error')}finally{if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-globe"></i> WEB'}}}
function applyWebClientModal(idx){var a=window.__webClientsModal||[],c=a[parseInt(idx)];if(!c)return;var nm=webClientName(c),rr=webClientRuc(c),ne=document.getElementById('cl-n'),re=document.getElementById('cl-r');if(ne&&nm)ne.value=nm;if(re&&rr)re.value=rr;var box=document.getElementById('cl-web-results');if(box)box.style.display='none';toast('WEB: '+(nm||'Contribuyente')+(rr?' · RUC '+rr:''),'success')}
async function consultWebModal(){var r=((document.getElementById('cl-r')||{}).value||'').trim(),n=((document.getElementById('cl-n')||{}).value||'').trim(),raw=r||n;if(raw.indexOf('·')>=0)raw=raw.split('·')[0].trim();if(!raw){toast('Ingrese RUC o nombre del cliente para buscar en la web.','error');return}var btn=document.getElementById('cl-web');if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>'}try{var res=await fetch(SUPABASE_URL+'/functions/v1/dnit-ruc-lookup',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({q:raw})});var out=await res.json();if(!res.ok||!out||!out.ok){toast((out&&out.error)||'No se pudo consultar la fuente web.','error');return}var arr=Array.isArray(out.results)?out.results:[];if(!arr.length){toast('No se encontró coincidencia en RUC SUNCOM.','error');return}window.__webClientsModal=arr;if(arr.length===1){applyWebClientModal(0);return}var box=document.getElementById('cl-web-results');if(box){box.innerHTML=arr.slice(0,8).map(function(c,i){var nm=webClientName(c),rr=webClientRuc(c),st=c.state||'';return `<button type="button" class="w-full text-left px-3 py-2 rounded-lg border border-at-bdr hover:border-at-accent/50 mb-1" onclick="applyWebClientModal(${i})"><div class="text-sm font-semibold">${esc(nm||'Sin nombre')}</div><div class="text-xs text-at-mut">RUC: ${esc(rr||'-')}${st?' · '+esc(st):''}</div></button>`}).join('');box.style.display='block'}toast('Se encontraron '+arr.length+' coincidencias. Seleccione la correcta.','success')}catch(e){console.error(e);toast('No se pudo conectar con la consulta web.','error')}finally{if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-globe"></i> WEB'}}}function oPr(id){edId=id;var p=id?D.pres.find(function(x){return x.id===id}):null;tmpIt=p?JSON.parse(JSON.stringify(p.items)):[];mdl('<div class="p-6 mdl-pad"><div class="flex items-center justify-between mb-6"><h3 class="fd text-lg font-bold text-at-accent">'+(p?'EDITAR lass="overflow-x-auto"><table class="w-full text-sm"><thead><tr><th class="text-left text-xs text-at-mut p-2">Producto</th><th class="text-center text-xs text-at-mut p-2 w-20">Cant</th><th class="text-right text-xs text-at-mut p-2 w-32">P.Unit</th><th class="text-right text-xs text-at-mut p-2 w-32">Subt</th><th class="w-10"></th></tr></thead><tbody id="pi-tb"></tbody></table></div></div><div class="bg-at-bg rounded-lg p-4 mb-4"><div class="flex justify-between text-sm mb-1"><span class="text-at-mut">Subtotal:</span><span id="pi-sub" class="font-mono font-semibold">0</span></div><div class="flex justify-between text-sm mb-1"><span class="text-at-mut">IVA 10%:</span><span id="pi-iva" class="font-mono font-semibold">0</span></div><div class="flex justify-between text-lg font-bold border-t border-at-bdr pt-2 mt-2"><span class="text-at-accent">TOTAL:</span><span id="pi-tot" class="text-at-accent font-mono">0</span></div></div><div class="mb-4"><label class="text-xs text-at-mut font-semibold mb-1 block">Notas</label><textarea id="pp-no" class="inp" rows="2" placeholder="Observaciones...">'+(p?p.notas||'':'')+'</textarea></div><div class="flex justify-end gap-3"><button class="bs" onclick="cmdl()">Cancelar</button><button class="bp" onclick="svPr()"><i class="fas fa-save mr-2"></i>Guardar</button></div></div>');rPI()}
function aPI(){tmpIt.push({pid:0,desc:'',cant:1,pu:0});rPI()}
function rPI(){var tb=document.getElementById('pi-tb');if(!tb)return;tb.innerHTML=tmpIt.map(function(it,i){return'<tr class="border-b border-at-bdr/30"><td class="p-2"><select class="inp text-xs py-1" onchange="chPI('+i+',this.value)"><option value="0">-- Seleccionar --</option>'+D.products.map(function(p){return'<option value="'+p.id+'" '+(it.pid===p.id?'selected':'')+'>'+p.nom+' ('+p.cod+')</option>'}).join('')+'<option value="-1"'+(it.pid===-1?' selected':'')+'>[ Personalizado ]</option></select>'+(it.pid===-1?'<input class="inp text-xs py-1 mt-1" value="'+it.desc+'" onchange="tmpIt['+i+'].desc=this.value" placeholder="Descripcion">':'')+'</td><td class="p-2"><input type="number" min="1" class="inp text-xs py-1 text-center w-20" value="'+it.cant+'" onchange="tmpIt['+i+'].cant=parseInt(this.value)||1;uPI()"></td><td class="p-2"><input type="number" class="inp text-xs py-1 text-right w-32" value="'+it.pu+'" onchange="tmpIt['+i+'].pu=parseInt(this.value)||0;uPI()"></td><td class="p-2 text-right font-mono font-semibold text-sm">'+fgs(it.cant*it.pu)+'</td><td class="p-2"><button onclick="tmpIt.splice('+i+',1);rPI()" class="text-at-err hover:text-white"><i class="fas fa-times"></i></button></td></tr>'}).join('')||'<tr><td colspan="5" class="text-center text-at-mut py-4 text-sm">Sin items</td></tr>';uPI()}
function chPI(i,v){var pid=parseInt(v);tmpIt[i].pid=pid;if(pid>0){var pr=D.products.find(function(p){return p.id===pid});if(pr){tmpIt[i].desc=pr.nom;tmpIt[i].pu=pr.pv}}rPI()}
function uPI(){var s=tmpIt.reduce(function(a,it){return a+it.cant*it.pu},0);var iv=Math.round(s*IVA);var e=function(id){return document.getElementById(id)};if(e('pi-sub'))e('pi-sub').textContent=fgs(s);if(e('pi-iva'))e('pi-iva').textContent=fgs(iv);if(e('pi-tot'))e('pi-tot').textContent=fgs(s+iv)}
function svPr(){var cl=document.getElementById('pp-cl').value.trim();if(!cl){toast('Ingrese cliente','error');return}if(tmpIt.length===0||tmpIt.every(function(x){return!x.desc})){toast('Agregue items','error');return}var sub=tmpIt.reduce(function(a,it){return a+it.cant*it.pu},0);var iv=Math.round(sub*IVA);var clId=resolveClientId('pp');var d={fecha:document.getElementById('pp-fe').value,val:parseInt(document.getElementById('pp-va').value)||15,cln:cl,clr:document.getElementById('pp-cr').value.trim(),clt:document.getElementById('pp-ct').value.trim(),cld:document.getElementById('pp-cd').value.trim(),clId:clId,items:tmpIt.filter(function(x){return x.desc}),sub:sub,iva:iv,total:sub+iv,notas:document.getElementById('pp-no').value.trim(),estado:document.getElementById('pp-es')?document.getElementById('pp-es').value:'Pendiente'};if(edId){var i=D.pres.findIndex(function(p){return p.id===edId});if(i>=0)D.pres[i]=Object.assign({},D.pres[i],d);toast('Presupuesto actualizado')}else{d.id=gid();d.num=D.np++;D.pres.push(d);toast('Presupuesto creado')}saveD();cmdl();rPres()}

function convFac(pid){var pr=D.pres.find(function(p){return p.id===pid});if(!pr)return;var f={id:gid(),num:D.nf++,fecha:tdy(),cln:pr.cln,clr:pr.clr,clt:pr.clt,cld:pr.cld,clId:pr.clId||0,items:JSON.parse(JSON.stringify(pr.items)),sub:pr.sub,iva:pr.iva,total:pr.total,cond:'Contado',timb:getBiz().timbrado||'',estado:'Pagada',pagos:[]};addInvoicePayment(f,f.total,f.fecha,'Contado');D.facs.push(f);pr.estado='Aprobado';f.items.forEach(function(it){if(it.pid>0){var p=D.products.find(function(x){return x.id===it.pid});if(p)p.st=Math.max(0,p.st-it.cant)}});saveD();toast('Factura FAC-'+String(f.num).padStart(3,'0')+' creada y cobro registrado en Caja');nav('fac')}

// ==================== PDF PRESUPUESTO (CORREGIDO) ====================
function pdfPr(id){
    var pr=D.pres.find(function(p){return p.id===id});if(!pr)return;
    var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();
    var BIZ=getBiz();

    // --- Membrete claro y profesional ---
    // Linea verde superior
    doc.setFillColor(0,153,76);doc.rect(0,0,210,4,'F');
    // Fondo blanco del membrete
    doc.setFillColor(255,255,255);doc.rect(0,4,210,36,'F');
    // Linea inferior del membrete
    doc.setDrawColor(0,153,76);doc.setLineWidth(0.5);doc.line(15,40,195,40);

    // Logo (si existe)
    if(BIZ.logo){try{doc.addImage(BIZ.logo,'JPEG',15,8,12,12)}catch(e){}}

    // Nombre empresa
    doc.setTextColor(0,100,50);doc.setFontSize(20);doc.setFont('helvetica','bold');
    doc.text(BIZ.name||'EMPRESA',15,18);
    // Datos empresa
    doc.setTextColor(80,80,80);doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text('RUC: '+(BIZ.ruc||'-'),15,25);
    doc.text('Tel: '+(BIZ.tel||'-'),15,30);
    doc.text(BIZ.dir||'',15,35);

    // Titulo documento
    doc.setTextColor(0,100,50);doc.setFontSize(16);doc.setFont('helvetica','bold');
    doc.text('PRESUPUESTO',195,18,{align:'right'});
    // Numero y fecha
    doc.setTextColor(80,80,80);doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.text('Nro: PRES-'+String(pr.num).padStart(3,'0'),195,26,{align:'right'});
    doc.text('Fecha: '+fdt(pr.fecha),195,32,{align:'right'});
    doc.text('Validez: '+pr.val+' dias',195,37,{align:'right'});

    // --- Datos del cliente ---
    var y=48;
    doc.setFillColor(245,248,245);doc.roundedRect(15,y,180,22,2,2,'F');
    doc.setTextColor(0,100,50);doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('CLIENTE:',20,y+7);
    doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');
    doc.text(pr.cln,42,y+7);
    if(pr.clr){doc.setTextColor(0,100,50);doc.setFont('helvetica','bold');doc.text('RUC/CI:',105,y+7);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text(pr.clr,125,y+7)}
    if(pr.clt){doc.setTextColor(0,100,50);doc.setFont('helvetica','bold');doc.text('Tel:',20,y+14);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text(pr.clt,32,y+14)}
    if(pr.cld){doc.setTextColor(0,100,50);doc.setFont('helvetica','bold');doc.text('Dir:',105,y+14);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text(pr.cld,117,y+14)}

    // --- Tabla de items ---
    y=76;
    doc.autoTable({
        startY:y,
        head:[['Cant.','Descripcion','P. Unitario','Subtotal']],
        body:pr.items.map(function(it){return[it.cant,it.desc,fgsPdf(it.pu),fgsPdf(it.cant*it.pu)]}),
        theme:'grid',
        headStyles:{fillColor:[0,100,50],textColor:[255,255,255],fontStyle:'bold',fontSize:9},
        bodyStyles:{textColor:[40,40,40],fontSize:9},
        columnStyles:{0:{halign:'center',cellWidth:18},2:{halign:'right',cellWidth:38},3:{halign:'right',cellWidth:38}},
        margin:{left:15,right:15}
    });

    // --- Totales ---
    y=doc.lastAutoTable.finalY+8;
    doc.setTextColor(40,40,40);

function rentPages(x){return Math.max(0,(parseInt(x.contActual)||0)-(parseInt(x.contAnterior)||0))}

function rentPeriodsBefore(x,periodo){var ks={};x.cargos=x.cargos||{};Object.keys(x.cargos).forEach(function(k){if(k<periodo)ks[k]=1});rentPayments(x).forEach(function(p){if(p.aplicaciones&&Array.isArray(p.aplicaciones)){p.aplicaciones.forEach(function(ap){if(ap.periodo<periodo)ks[ap.periodo]=1})}else{var k=p.periodo||rentPeriodKey(p.fecha);if(k<periodo)ks[k]=1}});return Object.keys(ks).sort()}

d economica</label><input id="bz-act" class="inp" value="'+(b.actividad||'')+'" placeholder="Venta de productos y servicios informaticos"></div>';h+='<div class="border border-at-accent/20 bg-at-accent/5 rounded-xl p-4"><h4 class="fd text-sm font-bold text-at-accent mb-3"><i class="fas fa-file-invoice mr-2"></i>DATOS DEL TIMBRADO</h4><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div><label class="text-xs text-at-mut font-semibold mb-1 block">Timbrado</label><input id="bz-ti" class="inp" value="'+(b.timbrado||'')+'" placeholder="Numero"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Establecimiento</label><input id="bz-es" class="inp" value="'+(b.establecimiento||'001')+'" placeholder="001"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Punto de expedicion</label><input id="bz-pu" class="inp" value="'+(b.punto||'001')+'" placeholder="001"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Desde</label><input id="bz-de" class="inp" value="'+(b.desde||'0000001')+'" placeholder="0000001"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Hasta</label><input id="bz-ha" class="inp" value="'+(b.hasta||'9999999')+'" placeholder="9999999"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Inicio vigencia</label><input id="bz-vi" type="date" class="inp" value="'+(b.inicioVig||'')+'"></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Fin vigencia</label><input id="bz-vf" type="date" class="inp" value="'+(b.finVig||'')+'"></div></div></div>';h+='<div class="border border-at-bdr rounded-xl p-4"><h4 class="fd text-sm font-bold text-at-accent mb-3"><i class="fas fa-palette mr-2"></i>APARIENCIA GLOBAL (ADMINISTRADOR)</h4><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div><label class="text-xs text-at-mut font-semibold mb-1 block">Modo de pantalla</label><select id="bz-theme" class="inp"><option value="dark" '+(b.theme==='light'?'':'selected')+'>Oscuro</option><option value="light" '+(b.theme==='light'?'selected':'')+'>Claro</option></select></div><div><label class="text-xs text-at-mut font-semibold mb-1 block">Color de acento</label><select id="bz-accent" class="inp"><option value="green" '+(b.accent==='green'?'selected':'')+'>Verde</option><option value="cyan" '+(b.accent==='cyan'?'selected':'')+'>Celeste</option><option value="yellow" '+(b.accent==='yellow'?'selected':'')+'>Amarillo</option><option value="orange" '+(b.accent==='orange'?'selected':'')+'>Naranja</option><option value="purple" '+(b.accent==='purple'?'selected':'')+'>Violeta</option><option value="pink" '+(b.accent==='pink'?'selected':'')+'>Rosa</option><option value="blue" '+(b.accent==='blue'?'selected':'')+'>Azul</option></select></div></div><p class="appear-note mt-2">El color elegido cambia los textos de marca, iconos, bordes y botones. Los colores de estados (rojo/amarillo/celeste) se conservan para que los reportes sigan siendo faciles de leer.</p></div>';h+='<div><label class="text-xs text-at-mut font-semibold mb-1 block">URL del Logo</label><input id="bz-logo" class="inp" value="'+(b.logo||'')+'" placeholder="https://..."></div>';h+='<div class="bg-at-bg/50 border border-at-bdr rounded-lg p-3 text-xs text-at-mut"><i class="fas fa-circle-info text-at-cyan mr-1"></i>Estos campos controlan la presentacion e impresion de la factura.</div>';h+='<div class="flex justify-end gap-3 pt-3 border-t border-at-bdr"><button class="bs" onclick="cmdl()">Cancelar</button><button class="bp" onclick="svBiz()"><i class="fas fa-save mr-2"></i>Guardar Cambios</button></div></div>';mdl(h)}function svBiz(){if(!CU||CU.role!=='admin'){toast('Solo el administrador puede guardar esta configuracion','error');return}var g=function(id){var e=document.getElementById(id);return e?e.value:''};var b=getBiz();b.name=g('bz-name');b.short=g('bz-short');b.sub=g('bz-sub');b.ruc=g('bz-ruc');b.tel=g('bz-tel');b.email=g('bz-email');b.dir=g('bz-dir');b.actividad=g('bz-act');b.timbrado=g('bz-ti');b.establecimiento=g('bz-es')||'001';b.punto=g('bz-pu')||'001';b.desde=g('bz-de');b.hasta=g('bz-ha');b.inicioVig=g('bz-vi');b.finVig=g('bz-vf');b.logo=g('bz-logo');b.theme=g('bz-theme')||'dark';b.accent=g('bz-accent')||'green';if(!b.name){toast('Ingrese el nombre de fantasia','error');return}if(!b.short)b.short=b.name.split(' ')[0]||'EMP';saveBiz(b);aplyBiz();cmdl();toast('Configuracion guardada')}function toggleSidebar(forceState){var aside=document.getElementById('sb-aside');var overlay=document.getElementById('sb-overlay');if(!aside)return;var isOpen=aside.classList.contains('open');var willOpen=(forceState===true)||(forceState===undefined&&!isOpen);if(willOpen){aside.classList.add('open');if(overlay){overlay.classList.remove('hide')}}else{aside.classList.remove('open');if(overlay){overlay.classList.add('hide')}}}
